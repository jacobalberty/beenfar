# Adds a Pangolin site connector (Newt) to the default stack and turns off the
# local Caddy proxy, because Pangolin does the routing instead.
#
#   docker compose -f compose.yaml -f compose.pangolin.yaml up -d
#
# Create a site in Pangolin first and put its ID and secret in .env:
#   PANGOLIN_ENDPOINT=https://pangolin.example.com
#   NEWT_ID=...
#   NEWT_SECRET=...
# Then add the resource and its targets in Pangolin; deploy/README.md lists
# them. beenfard (127.0.0.1:8080) and the UI (127.0.0.1:8081) are reachable to
# Newt on the host network.
services:
  newt:
    image: fosrl/newt:latest
    restart: unless-stopped
    network_mode: host
    environment:
      PANGOLIN_ENDPOINT: ${PANGOLIN_ENDPOINT:?set PANGOLIN_ENDPOINT}
      NEWT_ID: ${NEWT_ID:?set NEWT_ID}
      NEWT_SECRET: ${NEWT_SECRET:?set NEWT_SECRET}

  proxy:
    # Not started: Pangolin routes the paths. (Compose skips a service whose
    # profile is not enabled.)
    profiles: [local-proxy]

name: Go

on:
  # Pushes to main and releases run this suite via docker-publish.yml
  # (workflow_call), so there is deliberately no push trigger here.
  pull_request:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  GOLANGCI_LINT_VERSION: v2.15.0
  GOVULNCHECK_VERSION: v1.9.0
  BUF_VERSION: 1.61.0

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # Lint tooling needs a newer Go than the go.mod directive
          go-version: stable
          check-latest: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}

  api:
    name: protos and generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: api/go.mod
          check-latest: true
      - uses: bufbuild/buf-action@v1
        with:
          version: ${{ env.BUF_VERSION }}
          setup_only: true
      - name: buf lint
        working-directory: api
        run: buf lint
      - name: buf format
        working-directory: api
        run: buf format --diff --exit-code
      - name: buf breaking
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags --depth=1 origin "$GITHUB_BASE_REF"
          if ! git cat-file -e "origin/$GITHUB_BASE_REF:api/buf.yaml" 2>/dev/null; then
            echo "Base branch has no api/ module yet; nothing to compare against."
            exit 0
          fi
          buf breaking api --against ".git#ref=origin/$GITHUB_BASE_REF,subdir=api"
      - name: Regenerate code
        run: |
          (cd api && go generate -run install . && go generate .)
          go generate ./internal/store/sqlite
      - name: Fail if generated code is stale
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Generated code is out of date. Run 'go generate ./api ./internal/store/sqlite' (after 'go generate -run install ./api') and commit the result."
            git status --porcelain
            git --no-pager diff --stat
            exit 1
          fi
      - name: Generated Go code lives only under gen/
        run: |
          stray=$(git grep -l -E '^// Code generated .* DO NOT EDIT\.$' -- '*.go' ':!**/gen/**' || true)
          if [ -n "$stray" ]; then
            echo "::error::Generated files outside a gen/ directory:"
            echo "$stray"
            exit 1
          fi
      - name: Vet and build the api module
        working-directory: api
        run: |
          go vet ./...
          go build ./...

  gofix:
    name: go fix is clean
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go fix ./...
      - name: Fail if go fix changed anything
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::'go fix' produced changes. Run it locally and commit the result."
            git --no-pager diff
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          check-latest: true
      - run: go run golang.org/x/vuln/cmd/govulncheck@${{ env.GOVULNCHECK_VERSION }} ./...

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - run: go vet ./...
      - run: go build -v ./...
      - run: go test -race -shuffle=on -count=1 -v -covermode=atomic ./...

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Test
        run: go test -v -covermode=count -coverprofile=coverage.out ./...
      - name: Convert coverage.out to coverage.lcov
        uses: jandelgado/gcov2lcov-action@v1.2.0
      - name: Coveralls
        uses: coverallsapp/github-action@master
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: coverage.lcov

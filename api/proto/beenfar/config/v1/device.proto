syntax = "proto3";

package beenfar.config.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// DeviceService manages network devices: discovery results, adoption and
// removal. Devices are created by adapters when they are first seen, in the
// PENDING state; AdoptDevice brings one under management.
service DeviceService {
  // GetDevice returns one device by id.
  rpc GetDevice(GetDeviceRequest) returns (GetDeviceResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {
      get: "/api/v1/devices/{id}"
      response_body: "device"
    };
  }

  // ListDevices returns devices, ordered by MAC address.
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/api/v1/devices"};
  }

  // ListPendingDevices returns devices that have been seen but not adopted.
  rpc ListPendingDevices(ListPendingDevicesRequest) returns (ListPendingDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/api/v1/pending-devices"};
  }

  // AdoptDevice brings a pending device under management, or accepts the
  // re-adoption of an adopted device whose readoption is AWAITING_ACCEPTANCE.
  // It fails with NOT_FOUND if no such device has been seen and
  // FAILED_PRECONDITION if it is already adopted and not awaiting.
  rpc AdoptDevice(AdoptDeviceRequest) returns (AdoptDeviceResponse) {
    option (google.api.http) = {
      post: "/api/v1/devices:adopt"
      body: "*"
      response_body: "device"
    };
  }

  // ForgetDevice stops managing a device. An adopted device is factory reset
  // (for UniFi: told to reset itself on its next inform), so that it comes back
  // as a new, pending device that can be adopted again. The reset can only be
  // delivered when the device next contacts the controller, so until then the
  // device stays in the list with forgetting set, and is removed once it has
  // reset; asking again meanwhile changes nothing, and force gives up waiting
  // and removes it at once without resetting it (the device then still holds
  // the key beenfar threw away, so it must be reset by hand before it can be
  // adopted: it shows as locked). A pending or locked device has nothing to
  // reset and is removed at once.
  rpc ForgetDevice(ForgetDeviceRequest) returns (ForgetDeviceResponse) {
    option idempotency_level = IDEMPOTENT;
    option (google.api.http) = {delete: "/api/v1/devices/{id}"};
  }
}

// DeviceState is the adoption state of a device.
enum DeviceState {
  DEVICE_STATE_UNSPECIFIED = 0;
  DEVICE_STATE_PENDING = 1;
  DEVICE_STATE_ADOPTED = 2;
}

// ReadoptionState says where an adopted device that came back without its
// key stands. It is the same managed device throughout, not a new one.
enum ReadoptionState {
  // Nothing to do.
  READOPTION_STATE_UNSPECIFIED = 0;
  // The device was reset (typically a factory reset) and is waiting for
  // someone to accept re-adopting it with AdoptDevice. Nothing is sent to it
  // until then.
  READOPTION_STATE_AWAITING_ACCEPTANCE = 1;
  // Re-adoption was accepted and the device is being given a new key. The
  // state clears once it is running on it.
  READOPTION_STATE_IN_PROGRESS = 2;
}

// Device is a piece of network gear known to the controller.
message Device {
  // Server-assigned, immutable identifier.
  string id = 1 [(google.api.field_behavior) = IDENTIFIER];
  // MAC address, lower-case and colon-separated.
  string mac = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Name of the adapter that handles this device, e.g. "unifi".
  string adapter = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  DeviceState state = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  string model = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  string ip = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
  string firmware = 7 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp last_seen_time = 8 [(google.api.field_behavior) = OUTPUT_ONLY];
  // The device was seen but its adapter holds no credentials for it, so it
  // cannot be adopted yet (for UniFi: it is still managed by another
  // controller). Import its credentials, or reset it, and it stops being
  // locked the next time it is seen.
  bool locked = 9 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set while an adopted device that was reset is being adopted again.
  ReadoptionState readoption = 10 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Set while the device is being forgotten and the controller is waiting for
  // it to reset itself (see ForgetDevice). The device is removed once it has.
  bool forgetting = 11 [(google.api.field_behavior) = OUTPUT_ONLY];

  google.protobuf.Timestamp create_time = 21 [(google.api.field_behavior) = OUTPUT_ONLY];
  google.protobuf.Timestamp update_time = 22 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message GetDeviceRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
}

message GetDeviceResponse {
  Device device = 1;
}

message ListDevicesRequest {
  // Only return devices in this state. Unspecified returns all.
  DeviceState state = 1;
  // Only return devices handled by this adapter. Empty returns all.
  string adapter = 2;
}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message ListPendingDevicesRequest {
  // Only return devices handled by this adapter. Empty returns all.
  string adapter = 1;
}

message ListPendingDevicesResponse {
  repeated Device devices = 1;
}

message AdoptDeviceRequest {
  // The device to adopt, by id or by MAC address (any common notation).
  oneof device {
    string id = 1;
    string mac = 2;
  }
}

message AdoptDeviceResponse {
  Device device = 1;
}

message ForgetDeviceRequest {
  string id = 1 [(google.api.field_behavior) = REQUIRED];
  // Remove the device now instead of waiting for it to reset itself. Over REST:
  // DELETE /api/v1/devices/{id}?force=true.
  bool force = 2;
}

message ForgetDeviceResponse {
  // The device while it is still being forgotten (forgetting is set): it is
  // waiting to be reset. Unset once the device has been removed.
  Device device = 1;
}

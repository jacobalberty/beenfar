syntax = "proto3";

package beenfar.admin.v1;

import "google/api/annotations.proto";
import "google/api/field_behavior.proto";
import "google/protobuf/timestamp.proto";

// AdapterService reports the device adapters registered with the controller.
service AdapterService {
  // ListAdapters returns every registered adapter, ordered by name.
  rpc ListAdapters(ListAdaptersRequest) returns (ListAdaptersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/api/v1/adapters"};
  }

  // ImportUnifiDeviceKeys stores the credentials of UniFi devices that
  // another controller manages, so that this controller can read their
  // informs once they are pointed at it. The devices are recorded as pending
  // (with their real model once they have informed) and are adopted, which
  // re-keys them, like any other. The keys are never returned by any API.
  rpc ImportUnifiDeviceKeys(ImportUnifiDeviceKeysRequest) returns (ImportUnifiDeviceKeysResponse) {
    option (google.api.http) = {
      post: "/api/v1/adapters/unifi:import-device-keys"
      body: "*"
    };
  }
}

// AdapterKind says where an adapter runs.
enum AdapterKind {
  ADAPTER_KIND_UNSPECIFIED = 0;
  // Compiled into beenfard.
  ADAPTER_KIND_BUILTIN = 1;
  // A separate process connected over the adapter API.
  ADAPTER_KIND_EXTERNAL = 2;
}

// Adapter is a device adapter, such as the built-in UniFi adapter.
message Adapter {
  // Unique adapter name, e.g. "unifi".
  string name = 1 [(google.api.field_behavior) = IDENTIFIER];
  AdapterKind kind = 2 [(google.api.field_behavior) = OUTPUT_ONLY];
  string version = 3 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Whether the adapter is running (built-in) or connected (external).
  bool healthy = 4 [(google.api.field_behavior) = OUTPUT_ONLY];
  // Last error reported by or about the adapter, if any.
  string status_message = 5 [(google.api.field_behavior) = OUTPUT_ONLY];
  // When the adapter started or last connected.
  google.protobuf.Timestamp connect_time = 6 [(google.api.field_behavior) = OUTPUT_ONLY];
}

message ListAdaptersRequest {}

message ListAdaptersResponse {
  repeated Adapter adapters = 1;
}

// UnifiDeviceKey is the credential of one UniFi device, as extracted from the
// controller that manages it (its MongoDB "x_authkey", or "mgmt.authkey" in
// the device's /var/etc/persisted/cfg/mgmt).
message UnifiDeviceKey {
  // MAC address, in any common notation.
  string mac = 1 [(google.api.field_behavior) = REQUIRED];
  // The device's AES key: 32 hex digits.
  string authkey = 2 [
    (google.api.field_behavior) = REQUIRED,
    (google.api.field_behavior) = INPUT_ONLY
  ];
  // Whether the device uses AES-GCM. Informational: each inform says how it
  // is encrypted, and the reply uses the same.
  bool gcm = 3;
}

message ImportUnifiDeviceKeysRequest {
  repeated UnifiDeviceKey devices = 1;
}

message ImportUnifiDeviceKeysResponse {
  // How many devices' keys were stored.
  int32 imported = 1;
}

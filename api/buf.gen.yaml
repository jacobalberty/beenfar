# Generate with: go generate ./api  (or `buf generate` from api/)
# Go plugin versions are pinned in api/generate.go; install them with
# `go generate -run install ./api` before running buf. protoc-gen-es is pinned
# in ts/package.json and ts/package-lock.json; `npm ci --prefix ts` installs it.
version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/jacobalberty/beenfar/api/gen/go
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-openapi
    out: gen/openapi
    strategy: all
    # The adapter API is not part of the public REST surface.
    exclude_types:
      - beenfar.adapter.v1
    opt:
      - path=beenfar.openapi.json
      - format=json
      - base=openapi-base.yaml
      - features=google.api.http
      - trim-unused-types
      - short-service-tags
  # TypeScript messages and service descriptors, published as the npm package
  # @jacobalberty/beenfar-api (see .github/scripts/api-npm-package.sh). The
  # generated code imports the descriptors of google/api/*.proto, so those are
  # generated too. The adapter API is not for browsers.
  - local: ts/node_modules/.bin/protoc-gen-es
    out: gen/ts
    include_imports: true
    exclude_types:
      - beenfar.adapter.v1
    opt:
      - target=js+dts
      # Spell out ".js" in imports, so the output also loads under Node's ESM
      # resolution, not only through a bundler.
      - import_extension=js

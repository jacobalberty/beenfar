# Generate with: go generate ./api  (or `buf generate` from api/)
# Plugin versions are pinned in api/generate.go; install them with
# `go generate -run install ./api` before running buf.
version: v2
managed:
  enabled: true
  disable:
    - module: buf.build/googleapis/googleapis
  override:
    - file_option: go_package_prefix
      value: github.com/jacobalberty/beenfar/api/gen/go
plugins:
  - local: protoc-gen-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-go
    out: gen/go
    opt: paths=source_relative
  - local: protoc-gen-connect-openapi
    out: gen/openapi
    strategy: all
    opt:
      - path=beenfar.openapi.json
      - format=json
      - base=openapi-base.yaml
      - features=google.api.http
      - trim-unused-types
      - short-service-tags

version: "2"

run:
  # Lint the end-to-end suite (e2e/) too; it is behind a build tag.
  build-tags:
    - e2e

linters:
  enable:
    - sloglint
  settings:
    sloglint:
      # Every log call must carry a context so records are attributed to the
      # active trace/span and request (see internal/telemetry).
      context: all
      attr-only: true
  exclusions:
    paths:
      - "(^|/)gen/" # generated code (buf, sqlc)
